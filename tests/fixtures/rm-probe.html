<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>RM 模拟探针</title>
<style>
  body{margin:0;font:16px/1.6 -apple-system,sans-serif}
  /* 仅当 prefers-reduced-transparency:reduce 生效时制造水平溢出，
     运行器输出 overflowX>0 即证明 CDP 媒体特征模拟成功 */
  @media (prefers-reduced-transparency:reduce){ body{min-width:2200px} }
</style>
</head>
<body><p>reduced-transparency 模拟探针</p></body>
</html>
